steps:
  - name: publish-release
    image: codeberg.org/woodpecker-plugins/release
    settings:
      repo: codeberg.org/tardisgallifrey/adventure
      api_key:
        from_secret: codeberg_token 
      files:
        - "output/*.deb"
        - "output/*.rpm"
      note: Changelog.md
      title: "${CI_COMMIT_TAG}"
      target: main
    when:
      event: tag
      branch: ${CI_REPO_DEFAULT_BRANCH} 
