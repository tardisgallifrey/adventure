
name: Download and Run Game on Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-run:
    runs-on: windows-latest

    steps:
      - name: Create Installation Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Games\Adventure"

      - name: Download Latest JAR Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo "${{ github.repository }}" --pattern "adventure.jar" --dir "C:\Games\Adventure"

      - name: Bypass Windows SmartScreen Block
        shell: pwsh
        run: |
          # Programmatically strips the "Mark of the Web" zone identifier
          # This completely prevents the Windows 11 "unsafe app" popup from triggering
          Unblock-File -Path "C:\Games\Adventure\adventure.jar"
          Write-Host "File successfully unblocked for Windows Security."

      - name: Launch Game in a Console Terminal Window
        shell: cmd
        run: |
          :: 'start' opens a separate command prompt window rather than hiding it in the runner background
          :: 'cmd /k' keeps the terminal window open so the player can see text output and interact
          start "Adventure Game" cmd /k "java -jar C:\Games\Adventure\adventure.jar"
