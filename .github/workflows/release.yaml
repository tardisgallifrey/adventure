
name: Windows Game Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Parse Version Tag
        id: versioning
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR with Gradle
        run: ./gradlew build

      - name: Verify and Prepare JAR Location
        run: |
          if [ -f "build/libs/adventure.jar" ]; then
            cp build/libs/adventure.jar ./adventure.jar
          else
            echo "Error: adventure.jar not found!"
            exit 1
          fi

      - name: Create Windows Launcher Package
        run: |
          # 1. Create a dedicated directory for the Windows bundle
          mkdir adventure-play
          cp adventure.jar adventure-play/
          
          # 2. Programmatically generate the .bat launcher script inside the folder
          # '@echo off' keeps the script looking clean
          # 'java -jar' launches the game in a console window
          # 'pause' keeps the window open if the game closes or crashes so they see errors
          echo "@echo off" > adventure-play/run-game.bat
          echo "java -jar adventure.jar" >> adventure-play/run-game.bat
          echo "pause" >> adventure-play/run-game.bat
          
          # 3. Zip the folder up so it's a single download
          zip -r windows-adventure.zip adventure-play/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This uploads BOTH the standalone JAR and the specialized Windows zip bundle
          gh release create ${{ github.ref_name }} ./adventure.jar ./windows-adventure.zip \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release of Adventure game. Windows players should download windows-adventure.zip, extract and run 'run-game.bat'"
