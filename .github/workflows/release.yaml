
name: Create Game Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow only when you push a tag starting with 'v' (e.g., v1.0.0)

permissions:
  contents: write # Crucial permission: allows the workflow to create a GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest # Linux is faster and cheaper for building Java apps

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Highly reliable OpenJDK distribution

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR with Gradle
        run: ./gradlew build

      - name: Verify JAR Location
        run: |
          if [ -f "build/libs/adventure.jar" ]; then
            echo "Found JAR in build/libs. Copying to root..."
            cp build/libs/adventure.jar ./adventure.jar
          else
            echo "Error: adventure.jar not found!"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub
        run: |
          gh release create ${{ github.ref_name }} build/libs/adventure.jar \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release of Adventure game built by GitHub Actions."
